<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOder - AI Assistant</title>
    <link rel="stylesheet" href="./src/styles/main.css">
    <!-- highlight.js 样式通过 main.js 导入 -->
</head>
<body>
    <!-- WebGL背景容器 -->
    <canvas id="webgl-bg"></canvas>
    
    <!-- 主容器 -->
    <div id="app">
        <!-- 左侧边栏切换按钮 -->
        <button id="toggle-left-sidebar" class="sidebar-toggle left-toggle" title="切换对话列表">
            <span class="toggle-icon">◀</span>
        </button>
        
        <!-- 左侧对话侧边栏 -->
        <aside id="chat-sidebar" class="sidebar left-sidebar">
            <div class="sidebar-header">
                <h2>对话</h2>
                <button id="new-chat-btn" class="glass-btn" title="新建对话">+</button>
            </div>
            <div id="chat-list" class="chat-list"></div>
        </aside>
        
        <!-- 中央对话区域 -->
        <main id="chat-main">
            <!-- 对话消息区 -->
            <div id="messages-container">
                <div id="messages"></div>
            </div>
            
            <!-- TODOLIST显示区 -->
            <div id="todolist-panel" class="todolist-panel" style="display: none;">
                <div class="panel-header">
                    <h3>任务列表</h3>
                    <span id="todolist-progress">0/0</span>
                </div>
                <div id="todolist-items"></div>
            </div>
            
            <!-- 输入区域 -->
            <div id="input-area">
                <!-- 底部按钮组 -->
                <div class="input-toolbar">
                    <button id="global-settings-btn" class="glass-btn toolbar-btn" data-toggle="false" title="全局设置">
                        <span class="icon">⚙</span>
                    </button>
                    <button id="chat-settings-btn" class="glass-btn toolbar-btn" data-toggle="false" title="对话设置">
                        <span class="icon">💬</span>
                    </button>
                    <button id="web-search-btn" class="glass-btn toolbar-btn" data-toggle="false" title="联网搜索设置">
                        <span class="icon">🔍</span>
                    </button>
                    <button id="web-browse-btn" class="glass-btn toolbar-btn" data-toggle="false" title="网页分析设置">
                        <span class="icon">🌐</span>
                    </button>
                    <button id="toolbox-btn" class="glass-btn toolbar-btn" data-toggle="false" title="工具箱">
                        <span class="icon">🔧</span>
                    </button>
                    <button id="legacy-chain-btn" class="glass-btn toolbar-btn" data-toggle="false" title="旧版思维链">
                        <span class="icon">⛓</span>
                    </button>
                    <!-- 壁纸按钮已隐藏，通过连点5次发送键触发 -->
                </div>
                
                <!-- 文件附件预览区 -->
                <div id="file-attachments" class="file-attachments" style="display: none;"></div>
                
                <!-- 输入框 -->
                <div class="input-wrapper">
                    <button id="attach-file-btn" class="glass-btn attach-btn" title="添加文件附件">📎</button>
                    <input type="file" id="chat-file-input" multiple style="display: none;">
                    <textarea id="message-input" placeholder="输入消息... (Shift+Enter换行)"></textarea>
                    <button id="send-btn" class="glass-btn send-btn">发送</button>
                    <button id="stop-btn" class="glass-btn stop-btn" style="display:none;">停止</button>
                </div>
            </div>
        </main>
        
        <!-- 右侧文件侧边栏 -->
        <aside id="file-sidebar" class="sidebar right-sidebar">
            <div class="sidebar-tabs">
                <button class="tab-btn active" data-tab="summary">记忆概括</button>
                <button class="tab-btn" data-tab="files">文件列表</button>
                <button class="tab-btn" data-tab="tool-records">工具记录</button>
            </div>
            <div id="summary-panel" class="tab-panel active">
                <div class="empty-state">
                    <span>💭</span>
                    <p>暂无记忆概括</p>
                    <small>请先选择一个对话</small>
                </div>
            </div>
            <div id="files-panel" class="tab-panel">
                <div class="file-path-bar">
                    <input type="text" id="file-path-input" placeholder="文件夹路径">
                </div>
                <div class="file-action-bar">
                    <button id="load-folder-btn" class="glass-btn file-action-btn">加载文件夹</button>
                    <button id="refresh-folder-btn" class="glass-btn file-action-btn" title="刷新文件列表">↻ 刷新</button>
                    <button id="clear-folder-btn" class="glass-btn file-action-btn" title="清除文件列表">✕ 清除</button>
                </div>
                <div id="file-list" class="file-list"></div>
            </div>
            <div id="tool-records-panel" class="tab-panel">
                <div id="tool-records-list" class="tool-records-list">
                    <div class="tool-empty-state">暂无工具调用记录</div>
                </div>
            </div>
        </aside>
        
        <!-- 右侧边栏切换按钮 -->
        <button id="toggle-right-sidebar" class="sidebar-toggle right-toggle" title="切换文件列表">
            <span class="toggle-icon">▶</span>
        </button>
    </div>
    
    <!-- 配置弹窗 -->
    <div id="settings-modal" class="modal" style="display: none;">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h2 id="modal-title">设置</h2>
                <button class="close-modal glass-btn">×</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>
    
    <!-- 工具输出弹窗 -->
    <div id="tool-output-modal" class="tool-modal-overlay" style="display: none;">
        <div class="tool-modal-box">
            <div class="tool-modal-header">
                <span id="tool-modal-title">工具输出</span>
                <button id="tool-modal-close-btn" class="tool-modal-close">×</button>
            </div>
            <div id="tool-modal-body" class="tool-modal-body"></div>
        </div>
    </div>
    
    <!-- 壁纸设置弹窗 -->
    <div id="wallpaper-modal" class="modal" style="display: none;">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h2>设置壁纸</h2>
                <button class="close-wallpaper-modal glass-btn">×</button>
            </div>
            <div class="modal-body">
                <div class="wallpaper-options">
                    <div class="wallpaper-option active" data-wallpaper="webgl">
                        <div class="wallpaper-preview webgl-preview"></div>
                        <span>动态渐变</span>
                    </div>
                    <div class="wallpaper-option" data-wallpaper="dark">
                        <div class="wallpaper-preview dark-preview"></div>
                        <span>纯黑背景</span>
                    </div>
                    <div class="wallpaper-option" data-wallpaper="custom">
                        <div class="wallpaper-preview custom-preview">
                            <span>+</span>
                        </div>
                        <span>自定义图片</span>
                    </div>
                </div>
                <input type="file" id="wallpaper-file-input" accept="image/*" style="display: none;">
                
                <!-- 已保存的壁纸历史 -->
                <div id="wallpaper-history-section" style="margin-top:16px; display:none;">
                    <label style="font-size:13px; font-weight:600; display:block; margin-bottom:8px;">📁 已保存的壁纸</label>
                    <div id="wallpaper-history-list" style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;"></div>
                </div>
                
                <!-- 自定义壁纸参数调节 -->
                <div id="wallpaper-custom-params" style="margin-top:16px; display:none;">
                    <div style="margin-bottom:12px;">
                        <label style="font-size:13px; display:flex; justify-content:space-between; margin-bottom:4px;">
                            <span>模糊度</span>
                            <span id="blur-value-display">8px</span>
                        </label>
                        <input type="range" id="wallpaper-blur-slider" min="0" max="30" value="8" style="width:100%; accent-color: rgba(100,150,255,0.8);">
                    </div>
                    <div style="margin-bottom:8px;">
                        <label style="font-size:13px; display:flex; justify-content:space-between; margin-bottom:4px;">
                            <span>面板透明度</span>
                            <span id="opacity-value-display">35%</span>
                        </label>
                        <input type="range" id="wallpaper-opacity-slider" min="10" max="80" value="35" style="width:100%; accent-color: rgba(100,150,255,0.8);">
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="./src/main.js"></script>
</body>
</html>
